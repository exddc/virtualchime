name: chime CI

on:
  push:
    branches: [main]
    paths:
      - "**/CMakeLists.txt"
      - "cmake/**"
      - "chime/**"
      - "platform/**"
      - "webui/**"
      - "scripts/**"
      - "buildroot/**"
      - ".github/workflows/chime-ci.yml"
      - ".clang-format"
      - ".clang-tidy"
      - "webui/biome.json"
      - "webui/package.json"
      - "webui/bun.lock"
      - "schema/**"
  pull_request:
    paths:
      - "**/CMakeLists.txt"
      - "cmake/**"
      - "chime/**"
      - "platform/**"
      - "webui/**"
      - "scripts/**"
      - "buildroot/**"
      - ".github/workflows/chime-ci.yml"
      - ".clang-format"
      - ".clang-tidy"
      - "webui/biome.json"
      - "webui/package.json"
      - "webui/bun.lock"
      - "schema/**"
  workflow_dispatch:

concurrency:
  group: chime-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        build_type: [Release]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Official Kitware tarball instead of a JS action: setup-cmake still
      # calls url.parse() and warns under Node 24 (DEP0169).
      - name: Set up CMake 4.x
        run: |
          set -euo pipefail
          cmake_ver="4.0.0"
          cmake_sha256="a06e6e32da747e569162bc0442a3fd400fadd9db7d4f185c9e4464ab299a294b"
          curl -fsSL -o /tmp/cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v${cmake_ver}/cmake-${cmake_ver}-linux-x86_64.tar.gz"
          echo "${cmake_sha256}  /tmp/cmake.tar.gz" | sha256sum -c
          mkdir -p "${HOME}/cmake"
          tar -xzf /tmp/cmake.tar.gz -C "${HOME}/cmake" --strip-components=1
          echo "${HOME}/cmake/bin" >> "${GITHUB_PATH}"
          export PATH="${HOME}/cmake/bin:${PATH}"
          cmake --version

      # setup-bun only parses .bun-version / package.json / .tool-versions, not
      # buildroot/bun-version. Pass the pin explicitly so CI does not fall back
      # to "latest".
      - name: Read pinned Bun version
        id: bun-version
        run: echo "version=$(tr -d '[:space:]' < buildroot/bun-version)" >> "${GITHUB_OUTPUT}"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libmosquitto-dev \
            libssl-dev \
            clang-format-18 clang-tidy-18 shellcheck rsync

      - name: Install webui deps
        working-directory: webui
        run: |
          bun --version
          expected="$(tr -d '[:space:]' < ../buildroot/bun-version)"
          test "$(bun --version)" = "$expected"
          bun install --frozen-lockfile
          bun test
          bun run build
          bash ../buildroot/board/common/assert_chime_web_ui_dist.sh dist

      - name: Determine CI file scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "${base_sha}" || true
            fi
            if git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              echo "CHIME_CI_SCOPE=changed" >> "$GITHUB_ENV"
              echo "CHIME_CI_BASE_REF=${base_sha}" >> "$GITHUB_ENV"
            else
              echo "CHIME_CI_SCOPE=all" >> "$GITHUB_ENV"
              echo "CHIME_CI_BASE_REF=" >> "$GITHUB_ENV"
            fi
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            before_sha="${{ github.event.before }}"
            if git cat-file -e "${before_sha}^{commit}" 2>/dev/null; then
              echo "CHIME_CI_SCOPE=changed" >> "$GITHUB_ENV"
              echo "CHIME_CI_BASE_REF=${before_sha}" >> "$GITHUB_ENV"
            else
              echo "CHIME_CI_SCOPE=all" >> "$GITHUB_ENV"
              echo "CHIME_CI_BASE_REF=" >> "$GITHUB_ENV"
            fi
          else
            echo "CHIME_CI_SCOPE=all" >> "$GITHUB_ENV"
            echo "CHIME_CI_BASE_REF=" >> "$GITHUB_ENV"
          fi

      - name: Run repository lint/format checks
        run: |
          bash ./scripts/lint_format_ci.sh

      - name: Test source synchronization safeguards
        run: |
          bash ./scripts/test_sync_chime_src.sh
          bash ./scripts/test_sync_webui_src.sh

      - name: Test baked web UI image assertions
        run: |
          bash ./scripts/test_assert_chime_web_ui_dist.sh
          bash ./scripts/test_chime_post_build.sh
          bash ./scripts/test_ring_post_build.sh

      - name: Run chime CI checks
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
          CLANG_FORMAT_TOOL: clang-format-18
          CLANG_TIDY_TOOL: clang-tidy-18
        run: |
          bash ./scripts/chime_ci.sh

      - name: Run platform-only tests
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          bash ./scripts/platform_only_ci.sh
          bash ./scripts/test_platform_link_guard.sh

      - name: Assert checkout is clean
        run: |
          test -z "$(git status --porcelain)"

  # Cross-compile the chime packages only. This is not docker_build.sh and does
  # not produce sdcard.img (kernel, overlay, genimage).
  buildroot-chime:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Buildroot toolchain
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/openchime-buildroot
          # Exact defconfig key only. A restore-keys prefix can reuse gcc from
          # a different defconfig, and Buildroot will not rebuild it.
          key: buildroot-chime-${{ runner.os }}-2024.02.1-${{ hashFiles('buildroot/configs/openchime_rpi0w_defconfig') }}

      - name: Build Buildroot chime package
        env:
          BUILDROOT_WORK_DIR: ${{ runner.temp }}/openchime-buildroot
        run: |
          bash ./scripts/buildroot_chime.sh

      - name: Assert checkout is clean
        run: |
          test -z "$(git status --porcelain)"
